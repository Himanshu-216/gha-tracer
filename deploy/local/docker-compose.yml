# Local stack: gha-tracer + Prometheus + Grafana.
#   cp .env.example .env   # fill in your GitHub App values
#   docker compose up --build
#   gh webhook forward --org=<org> --events=workflow_run \
#      --url=http://localhost:8080/webhook --secret="$GITHUB_WEBHOOK_SECRET"
# Grafana: http://localhost:3000 (anonymous admin).
name: gha-tracer
services:
  gha-tracer:
    build: { context: ../.., dockerfile: Dockerfile }
    env_file: .env
    environment:
      REDELIVER_INTERVAL: 1h   # forwarded hooks aren't App deliveries; keep sweeper quiet locally
    volumes:
      - ./app.pem:/run/secrets/app.pem:ro   # your GitHub App private key
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9090:9090"]   # localhost only

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9091:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]   # anonymous Admin: never expose beyond localhost
    depends_on: [prometheus]
