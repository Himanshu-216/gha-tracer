# Add to your existing Prometheus. On ECS, gha-tracer registers in Cloud Map
# (private DNS); the internal port 9090 serves /metrics.
scrape_configs:
  - job_name: gha-tracer
    scrape_interval: 30s
    dns_sd_configs:
      - names: ["gha-tracer.gha-tracer.local"]   # <service>.<namespace> from Terraform outputs
        type: A
        port: 9090
