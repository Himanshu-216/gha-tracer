groups:
  - name: gha-tag-runs
    rules:
      # Fires while gha-tracer still exports the finished run (KEEP_COMPLETED,
      # default 1h), then resolves on its own.
      - alert: TagRunFailed
        expr: |
          max by (repo, workflow, tag, run_id) (gha_tag_run_status) == 2
            or max by (repo, workflow, tag, run_id) (gha_tag_run_status) == 4
        labels: { severity: critical }
        annotations:
          summary: "Tag run failed: {{ $labels.repo }} {{ $labels.tag }} ({{ $labels.workflow }})"
          description: "https://github.com/{{ $labels.repo }}/actions/runs/{{ $labels.run_id }}"

      - alert: TagRunStuck
        expr: max by (repo, workflow, tag, run_id) (gha_tag_run_status == 0 and gha_tag_run_duration_seconds > 7200)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Tag run running for over 2h: {{ $labels.repo }} {{ $labels.tag }} ({{ $labels.workflow }})"

  - name: gha-tracer-health
    rules:
      - alert: GhaTracerDown
        expr: up{job="gha-tracer"} == 0 or absent(up{job="gha-tracer"})
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "gha-tracer is not being scraped"

      - alert: GhaTracerRedeliveryGaveUp
        expr: increase(gha_redeliveries_total{result="gave_up"}[30m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "A webhook delivery failed 3 redeliveries; that run may be missing or stuck on Running"
